name: infra

on:
  push:
    branches: [main]
    paths: ['infra/**', 'azure.yaml', '.github/workflows/infra.yml']
  pull_request:
    paths: ['infra/**', 'azure.yaml', '.github/workflows/infra.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Bicep bouwen en linten
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep build --file infra/bootstrap/cicd.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep
          az bicep lint --file infra/bootstrap/cicd.bicep

  deploy:
    # Alleen als iemand in GitHub op "Run workflow" drukt, nooit automatisch bij een push.
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_ENV_NAME: dev
      AZURE_LOCATION: swedencentral
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: Azure/setup-azd@v2
      - name: Inloggen met OIDC, zonder secret
        run: azd auth login --client-id "$AZURE_CLIENT_ID" --tenant-id "$AZURE_TENANT_ID" --federated-credential-provider github
      - name: Uitrollen
        run: azd provision --no-prompt
